version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.fronted
    container_name: react-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.Backend
    container_name: json-backend
    ports:
      - "2000:2000"
